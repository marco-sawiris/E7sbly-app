<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>احسبلى — معاينة الموبايل</title><link rel="stylesheet" href="/fonts.css"><style>*{box-sizing:border-box}body{margin:0;background:#e6edf7;color:#1f347d;font-family:"Montserrat Arabic",Tahoma,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;gap:54px;padding:24px}.device{background:#1f347d;border:8px solid #1f347d;border-radius:33px;box-shadow:0 20px 60px #1f347d20;overflow:hidden;flex:none}iframe{border:0;display:block;width:390px;height:844px;background:#f5f8fd}aside{max-width:255px}aside h1{font-size:40px;letter-spacing:-2px;margin:0 0 18px}aside p{font-size:14px;line-height:2;color:#617999}aside span{font-size:11px;color:#7588a2} @media(max-width:800px){body{padding:14px;gap:0}aside{display:none}}</style></head><body><aside><span>تطبيق أندرويد · نسخة أولية</span><h1>احسبلى.</h1><p>نفس المنتج، أنهى أوفر؟<br>قارن الوزن والسعر، وسيب الحسبة علينا.</p><span>معاينة تفاعلية بمقاس الموبايل</span></aside><div class="device"><iframe src="/" title="تطبيق احسبلى" id="app-frame"></iframe></div><script>const width=Number(new URLSearchParams(location.search).get('width'));if(width>=320&&width<=700)document.getElementById('app-frame').style.width=width+'px';</script></body></html>
