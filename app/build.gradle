plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ehsably.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ehsably.app'
        minSdk 29
        targetSdk 35
        versionCode 19
        versionName '2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
