<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حركة wordIn على كافة العناصر</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --gold: #d99b26;
      --brown: #825325;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0e0b07;
      color: #ffffff;
      font-family: 'Cairo', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      gap: 30px;
    }

    /* ============================================================
       كود الحركة الأساسي (wordIn)
       ============================================================ */
    @keyframes wordIn {
      from {
        opacity: 0;
        transform: translateY(45px) rotateX(-65deg) scale(0.8);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateX(0) scale(1);
        filter: blur(0);
      }
    }

    /* تطبيق الحركة وتكرارها بشكل تلقائي للتوضيح */
    .word-in {
      perspective: 800px;
      animation: wordIn 900ms var(--ease-spring) infinite alternate;
      animation-delay: calc(var(--i, 0) * 150ms);
    }

    /* ============================================================
       تنسيقات العناصر المختبرة
       ============================================================ */
    .section-title {
      color: var(--gold);
      font-size: 20px;
      margin-bottom: 15px;
      width: 100%;
      max-width: 800px;
      border-bottom: 1px solid rgba(217, 155, 38, 0.2);
      padding-bottom: 8px;
    }

    .grid-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      align-items: center;
      max-width: 800px;
      width: 100%;
    }

    /* 1. النصوص */
    .text-title {
      font-size: 28px;
      font-weight: 800;
    }
    .text-title span {
      display: inline-block;
      animation: wordIn 800ms var(--ease-spring) infinite alternate;
      animation-delay: calc(var(--w, 0) * 100ms);
    }

    /* 2. الأيقونات */
    .icon-box {
      width: 70px;
      height: 70px;
      background: rgba(217, 155, 38, 0.15);
      border: 2px solid var(--gold);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: var(--gold);
    }

    /* 3. الأشكال الهندسية */
    .shape-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--brown));
    }
    .shape-square {
      width: 80px;
      height: 80px;
      border-radius: 14px;
      background: linear-gradient(135deg, #2e7d32, #1b5e20);
    }
    .shape-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 6px solid var(--gold);
    }

    /* 4. المربعات والبطاقات النصية */
    .card {
      background: #1a140d;
      border: 1px solid rgba(217, 155, 38, 0.3);
      padding: 20px;
      border-radius: 16px;
      width: 240px;
      text-align: center;
    }
    .card h4 { color: var(--gold); margin-bottom: 8px; }
    .card p { font-size: 14px; color: #a39585; }
  </style>
</head>
<body>

  <!-- 1. النصوص -->
  <div class="section-title">1. النصوص والعناوين</div>
  <div class="text-title">
    <span style="--w: 0;">تجربة</span>
    <span style="--w: 1;">حركة</span>
    <span style="--w: 2;">wordIn</span>
    <span style="--w: 3;">على</span>
    <span style="--w: 4;">الكلمات</span>
  </div>

  <!-- 2. الأيقونات -->
  <div class="section-title">2. الأيقونات</div>
  <div class="grid-row">
    <div class="icon-box word-in" style="--i: 0;"><i class="fa-solid fa-star"></i></div>
    <div class="icon-box word-in" style="--i: 1;"><i class="fa-solid fa-trophy"></i></div>
    <div class="icon-box word-in" style="--i: 2;"><i class="fa-solid fa-fire"></i></div>
    <div class="icon-box word-in" style="--i: 3;"><i class="fa-solid fa-shield-halved"></i></div>
  </div>

  <!-- 3. الأشكال الهندسية -->
  <div class="section-title">3. الأشكال الهندسية</div>
  <div class="grid-row">
    <div class="shape-circle word-in" style="--i: 0;"></div>
    <div class="shape-square word-in" style="--i: 1;"></div>
    <div class="shape-ring word-in" style="--i: 2;"></div>
  </div>

  <!-- 4. البطاقات والمربعات -->
  <div class="section-title">4. المربعات النصية والبطاقات</div>
  <div class="grid-row">
    <div class="card word-in" style="--i: 0;">
      <h4>البطاقة الأولى</h4>
      <p>هذا مربع نصي يرتفع للأعلى بحركة ثلاثية الأبعاد.</p>
    </div>
    <div class="card word-in" style="--i: 1;">
      <h4>البطاقة الثانية</h4>
      <p>تطبيق الحركة على مكونات واجهة المستخدم الكبيرة.</p>
    </div>
  </div>

</body>
</html>
